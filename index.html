button,input{font:inherit}.top{background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;padding:22px 18px 30px}

.iconbtn{border:1px solid #ffffff33;background:#ffffff12;color:white;border-radius:10px;padding:9px 11px;cursor:pointer}
.searchbox{margin-top:20px;background:white;border-radius:15px;display:flex;align-items:center;padding:5px;box-shadow:0 10px 35px #0003}

.main{padding:20px 18px 40px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.tabs{display:flex;gap:7px}.tab,.action{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}.tab.active{background:var(--primary);border-color:var(--primary);color:white}

body.dark .searchbox{background:#111827}body.dark .searchbox input{color:#f8fafc}

<header class="top">
<div class="topin">

</div>
</header>

<main class="main">
<div class="toolbar">
  <div class="tabs"><button class="tab active" data-tab="all">All</button><button class="tab" data-tab="fav">★ Favorites</button></div>
  <div style="display:flex;gap:7px"><button class="action" id="add">＋ Add Word</button></div>
</div>
<div class="count" id="count"></div>
<section id="results"></section>
</main>

<div class="modal" id="modal">
<div class="modalbox">
  <div class="modalhead"><h2>Add new word</h2><button class="close" id="close">×</button></div>

    <textarea id="nm" placeholder="Nepali meaning *"></textarea>
    <input id="ns" placeholder="Similar words">
    <input id="no" placeholder="Opposite words">
    <button class="save" id="save">Save word</button>
    <div class="note">Added words are saved in this browser using local storage. They remain available offline on this device/browser. Your original Excel file is not modified.</div>
  </div>
</div>
</div>

const KEY='korean-nepali-dictionary-custom-v1', FAV='korean-nepali-dictionary-favorites-v1';
let custom=JSON.parse(localStorage.getItem(KEY)||'[]');
let fav=new Set(JSON.parse(localStorage.getItem(FAV)||'[]'));
let tab='all';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function allData(){return [...ORIGINAL,...custom]}
function speak(text){
 if(!('speechSynthesis'in window)){alert('Speech synthesis is not available in this browser.');return}
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=.82;
 const vs=speechSynthesis.getVoices(); const v=vs.find(x=>/^ko(-|_)/i.test(x.lang))||vs.find(x=>/korean|한국/i.test(x.name)); if(v)u.voice=v;
 speechSynthesis.speak(u);
}
function isFav(x){return fav.has(x.word+'|'+x.meaning)}
function toggleFav(x){
 const k=x.word+'|'+x.meaning; isFav(x)?fav.delete(k):fav.add(k); localStorage.setItem(FAV,JSON.stringify([...fav]));render();
}
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 let arr=allData().filter(x=>!q||[x.word,x.meaning,x.similar,x.opposite].join(' ').toLowerCase().includes(q));
 if(tab==='fav')arr=arr.filter(isFav);
 document.getElementById('count').textContent=`${arr.length} result${arr.length===1?'':'s'} • ${allData().length} total entries`;
 const out=document.getElementById('results');
 if(!arr.length){out.innerHTML='<div class="empty"><div style="font-size:40px">🔎</div><h3>No word found</h3><p>Try another Korean or Nepali spelling, or add a new word.</p></div>';return}
 out.innerHTML=arr.slice(0,500).map((x,i)=>`
 <article class="card">
  <div class="grid">
   <div>
    <div class="label">Korean</div>
    <div class="wordrow"><span class="word">${esc(x.word)}</span>
      <button class="speak" data-i="${i}" title="Pronounce">🔊</button>
      <button class="star ${isFav(x)?'on':''}" data-f="${i}" title="Favorite">${isFav(x)?'★':'☆'}</button>
    </div>
   </div>
   <div>
    <div class="label">Nepali meaning</div><div class="meaning">${esc(x.meaning)||'—'}</div>
    ${x.similar?`<div class="extra sim"><b>Similar:</b> ${esc(x.similar)}</div>`:''}
    ${x.opposite?`<div class="extra opp"><b>Opposite:</b> ${esc(x.opposite)}</div>`:''}
   </div>
  </div>
 </article>`).join('');
 out.querySelectorAll('[data-i]').forEach((b,i)=>b.onclick=()=>speak(arr[i].word));
 out.querySelectorAll('[data-f]').forEach((b,i)=>b.onclick=()=>toggleFav(arr[i]));
}
document.getElementById('q').oninput=render;
document.getElementById('clear').onclick=()=>{document.getElementById('q').value='';render();document.getElementById('q').focus()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('knd-dark',document.body.classList.contains('dark'));};
if(localStorage.getItem('knd-dark')==='true')document.body.classList.add('dark');

const modal=document.getElementById('modal');
document.getElementById('add').onclick=()=>modal.classList.add('show');
document.getElementById('close').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
document.getElementById('save').onclick=()=>{
 const w=document.getElementById('nw').value.trim(),m=document.getElementById('nm').value.trim();
 if(!w||!m){alert('Please enter the Korean word and Nepali meaning.');return}
 custom.push({word:w,meaning:m,similar:document.getElementById('ns').value.trim(),opposite:document.getElementById('no').value.trim()});
 localStorage.setItem(KEY,JSON.stringify(custom));
 ['nw','nm','ns','no'].forEach(id=>document.getElementById(id).value='');
 modal.classList.remove('show');tab='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='all'));render();
};
render();
</script>
</body>
</html>
