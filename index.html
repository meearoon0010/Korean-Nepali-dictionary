<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Korean → Nepali Dictionary</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",Arial,sans-serif;background:#f4f6f8;color:#111827}
header{background:#111827;color:white;padding:22px 16px 18px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{opacity:.75;font-size:13px}
.wrap{max-width:760px;margin:auto;padding:14px}
.search{width:100%;padding:15px 16px;border:0;border-radius:14px;font-size:17px;outline:none;box-shadow:0 2px 10px #0001}
.controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:10px 13px;background:white;color:#111827;font-weight:600;box-shadow:0 1px 5px #0001}
button.active{background:#111827;color:white}
.stats{font-size:13px;color:#6b7280;margin:8px 2px 12px}
.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0000000b}
.row{display:flex;align-items:center;gap:8px}.ko{font-size:24px;font-weight:700;flex:1}.ne{font-size:18px;margin-top:8px}.opp{font-size:14px;color:#6b7280;margin-top:8px}
.speak{padding:7px 10px;font-size:16px}.fav{font-size:20px;padding:5px 8px}.empty{text-align:center;padding:40px 10px;color:#6b7280}
footer{text-align:center;color:#9ca3af;font-size:12px;padding:25px}
</style>
</head>
<body>
<header>
<div class="wrap" style="padding:0">
<h1>🇰🇷 Korean → Nepali Dictionary</h1>
<div class="sub">Offline • EPS-TOPIK study • 705 words</div>
</div>
</header>
<main class="wrap">
<input id="search" class="search" autocomplete="off" placeholder="Search Korean, Nepali, or English…">
<div class="controls">
<button id="allBtn" class="active">All</button>
<button id="favBtn">★ Favorites</button>
<button id="clearBtn">Clear</button>
</div>
<div id="stats" class="stats"></div>
<div id="list"></div>
<footer>Dictionary data from your uploaded Excel file.</footer>
</main>
<script src="data.js"></script>
<script>
const search = document.getElementById('search');
const list = document.getElementById('list');
const stats = document.getElementById('stats');
const allBtn = document.getElementById('allBtn');
const favBtn = document.getElementById('favBtn');
const clearBtn = document.getElementById('clearBtn');
let favorites = new Set(JSON.parse(localStorage.getItem('favorites') || '[]'));
let onlyFav = false;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  const q = search.value.trim().toLowerCase();
  let arr = DICTIONARY.filter((x,i)=>{
    if(onlyFav && !favorites.has(String(i))) return false;
    if(!q) return true;
    return (x.ko+' '+x.ne+' '+x.opp).toLowerCase().includes(q);
  });
  stats.textContent = `${arr.length} result${arr.length===1?'':'s'} • ${DICTIONARY.length} total`;
  if(!arr.length){list.innerHTML='<div class="empty">No matching word found.</div>';return;}
  list.innerHTML = arr.map(x=>{
    const i=DICTIONARY.indexOf(x), fav=favorites.has(String(i));
    return `<article class="card">
      <div class="row"><div class="ko">${esc(x.ko)}</div>
      <button class="speak" onclick="speak('${esc(x.ko).replace(/'/g,"\\'")}')">🔊</button>
      <button class="fav" onclick="toggleFav(${i})">${fav?'★':'☆'}</button></div>
      <div class="ne">${esc(x.ne)}</div>
      ${x.opp?`<div class="opp">반대말 / Opposite: <b>${esc(x.opp)}</b></div>`:''}
    </article>`;
  }).join('');
}
function speak(text){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u);
  }
}
function toggleFav(i){
  const k=String(i); favorites.has(k)?favorites.delete(k):favorites.add(k);
  localStorage.setItem('favorites',JSON.stringify([...favorites]));render();
}
search.addEventListener('input',render);
allBtn.onclick=()=>{onlyFav=false;allBtn.classList.add('active');favBtn.classList.remove('active');render();}
favBtn.onclick=()=>{onlyFav=true;favBtn.classList.add('active');allBtn.classList.remove('active');render();}
clearBtn.onclick=()=>{search.value='';render();search.focus();}
render();
</script>
</body>
</html>
