<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean - English & Nepali Dictionary</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            --badge-bg: #e0e7ff;
            --tag-synonym-bg: #dcfce7;
            --tag-synonym-txt: #166534;
            --tag-antonym-bg: #fee2e2;
            --tag-antonym-txt: #991b1b;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #818cf8;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            --badge-bg: #312e81;
            --tag-synonym-bg: #14532d;
            --tag-synonym-txt: #bbf7d0;
            --tag-antonym-bg: #7f1d1d;
            --tag-antonym-txt: #fecaca;
        }

        * { box-sizing: border-box; transition: background-color 0.2s, color 0.2s; }
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .btn-icon:hover {
            background-color: var(--border-color);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1.5rem;
            flex-grow: 1;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .word-list {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-height: 600px;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .word-item {
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-item:hover, .word-item.selected {
            background-color: var(--badge-bg);
        }

        .word-item .kr {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .word-item .meaning {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }

        .details-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 5rem;
            height: fit-content;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .details-title h2 {
            font-size: 2.2rem;
            margin: 0;
            color: var(--text-primary);
        }

        .details-title p {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 0.4rem 0 0 0;
            font-weight: 500;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .meta-group {
            margin-bottom: 1.5rem;
        }

        .meta-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tag.synonym {
            background-color: var(--tag-synonym-bg);
            color: var(--tag-synonym-txt);
        }

        .tag.antonym {
            background-color: var(--tag-antonym-bg);
            color: var(--tag-antonym-txt);
        }

        .example-box {
            background-color: var(--bg-primary);
            border-left: 4px solid var(--accent-color);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-top: 0.5rem;
        }

        .example-kr {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }

        .example-en {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-book-bookmark"></i>
            <span>한국어 사전 (Korean Dictionary)</span>
        </div>
        <div class="nav-actions">
            <button class="btn-icon" id="saved-filter-btn" title="Saved Words">
                <i class="fa-regular fa-bookmark"></i>
            </button>
            <button class="btn-icon" id="theme-btn" title="Toggle Dark/Light Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search Korean word or meaning...">
            </div>
            
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">All Words</button>
                <button class="tab-btn" data-filter="synonyms">With Similar Words</button>
                <button class="tab-btn" data-filter="antonyms">With Opposite Words</button>
            </div>

            <div class="word-list" id="word-list"></div>
        </div>

        <div class="details-section">
            <div class="details-card" id="details-card">
                <div class="empty-state">
                    <i class="fa-solid fa-language"></i>
                    <p>Select a word from the list to view its full details, pronunciation, similar & opposite words, and example sentence.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Full dataset extracted directly from DICTIONARY.xlsx
        const dictionaryData = [
            {"word": "가게", "meaning": "पसल", "synonym": "", "antonym": ""},
            {"word": "가구", "meaning": "परिवार", "synonym": "가족", "antonym": ""},
            {"word": "가족", "meaning": "परिवार", "synonym": "가구", "antonym": ""},
            {"word": "가능하다", "meaning": "सम्भव हुनु", "synonym": "", "antonym": "불가능하다"},
            {"word": "비비다", "meaning": "माड्नु, मिच्नु", "synonym": "", "antonym": ""},
            {"word": "가렵다", "meaning": "चिलाउनु", "synonym": "간지럽다", "antonym": ""},
            {"word": "가르치다", "meaning": "सिकाउनु", "synonym": "", "antonym": ""},
            {"word": "가옥", "meaning": "घर", "synonym": "", "antonym": ""},
            {"word": "가옥", "meaning": "कोरीयाको परम्परागत घर", "synonym": "한옥", "antonym": ""},
            {"word": "가전체품", "meaning": "HOME APPLIANCES", "synonym": "", "antonym": ""},
            {"word": "가격", "meaning": "मूल्य", "synonym": "값", "antonym": ""},
            {"word": "값", "meaning": "मूल्य", "synonym": "가격", "antonym": ""},
            {"word": "가난하다", "meaning": "गरीब हुनु", "synonym": "", "antonym": "부유하다"},
            {"word": "부유하다", "meaning": "धनी हुनु", "synonym": "부자", "antonym": "가난하다"},
            {"word": "가깝다", "meaning": "नजिक हुनु", "synonym": "", "antonym": "멀다"},
            {"word": "멀다", "meaning": "टाढा हुनु", "synonym": "", "antonym": "가깝다"},
            {"word": "가볍다", "meaning": "हल्का हुनु", "synonym": "", "antonym": "무겁다"},
            {"word": "무겁다", "meaning": "गह्रौ हुनु", "synonym": "", "antonym": "가볍다"},
            {"word": "가장", "meaning": "सबैभन्दा", "synonym": "제일", "antonym": ""},
            {"word": "제일", "meaning": "सबैभन्दा", "synonym": "가장", "antonym": ""},
            {"word": "간단하다", "meaning": "सरल हुनु", "synonym": "쉬운", "antonym": "복잡하다"},
            {"word": "복잡하다", "meaning": "जटिल हुनु, भीड हुनु", "synonym": "", "antonym": "간단하다"}
        ];

        let currentFilter = 'all';
        let savedWords = JSON.parse(localStorage.getItem('saved_words') || '[]');
        let selectedWord = null;
        let showingOnlySaved = false;

        const wordListEl = document.getElementById('word-list');
        const searchInput = document.getElementById('search-input');
        const detailsCard = document.getElementById('details-card');
        const themeBtn = document.getElementById('theme-btn');
        const savedFilterBtn = document.getElementById('saved-filter-btn');
        const filterTabs = document.querySelectorAll('.tab-btn');

        themeBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            themeBtn.querySelector('i').className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });

        filterTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                filterTabs.forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderWordList();
            });
        });

        savedFilterBtn.addEventListener('click', () => {
            showingOnlySaved = !showingOnlySaved;
            savedFilterBtn.classList.toggle('active', showingOnlySaved);
            savedFilterBtn.style.color = showingOnlySaved ? 'var(--accent-color)' : '';
            renderWordList();
        });

        searchInput.addEventListener('input', () => renderWordList());

        function renderWordList() {
            const query = searchInput.value.toLowerCase().trim();
            wordListEl.innerHTML = '';

            const filtered = dictionaryData.filter(item => {
                const matchesSearch = item.word.toLowerCase().includes(query) || item.meaning.toLowerCase().includes(query);
                const matchesSaved = showingOnlySaved ? savedWords.includes(item.word) : true;
                
                if (!matchesSearch || !matchesSaved) return false;

                if (currentFilter === 'synonyms') return item.synonym.trim().length > 0;
                if (currentFilter === 'antonyms') return item.antonym.trim().length > 0;
                return true;
            });

            if (filtered.length === 0) {
                wordListEl.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--text-secondary);">No words found</div>`;
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = `word-item ${selectedWord && selectedWord.word === item.word ? 'selected' : ''}`;
                div.innerHTML = `
                    <div>
                        <div class="kr">${item.word}</div>
                        <div class="meaning">${item.meaning}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; color: var(--text-secondary);"></i>
                `;
                div.addEventListener('click', () => selectWord(item));
                wordListEl.appendChild(div);
            });
        }

        function selectWord(item) {
            selectedWord = item;
            renderWordList();
            const isSaved = savedWords.includes(item.word);

            detailsCard.innerHTML = `
                <div class="details-header">
                    <div class="details-title">
                        <h2>${item.word}</h2>
                        <p>${item.meaning}</p>
                    </div>
                    <div class="action-btns">
                        <button class="btn-icon" onclick="playAudio('${item.word}')" title="Listen Pronunciation">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                        <button class="btn-icon" onclick="toggleSave('${item.word}')" title="Save Word">
                            <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark" style="${isSaved ? 'color: var(--accent-color);' : ''}"></i>
                        </button>
                    </div>
                </div>

                ${item.synonym ? `
                    <div class="meta-group">
                        <div class="meta-label"><i class="fa-solid fa-equals"></i> Similar Words (비슷한 말)</div>
                        <div class="tag-container">
                            ${item.synonym.split('/').map(s => `<span class="tag synonym">${s.trim()}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}

                ${item.antonym ? `
                    <div class="meta-group">
                        <div class="meta-label"><i class="fa-solid fa-arrow-right-arrow-left"></i> Opposite Words (반대말)</div>
                        <div class="tag-container">
                            ${item.antonym.split('/').map(a => `<span class="tag antonym">${a.trim()}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}

                <div class="meta-group" style="margin-top: 1.5rem;">
                    <div class="meta-label"><i class="fa-solid fa-quote-left"></i> Example Sentence (예문)</div>
                    <div class="example-box">
                        <div class="example-kr">${item.word} 단어의 뜻을 생각하여 문장을 구성해 보세요.</div>
                        <div class="example-en">Meaning: ${item.meaning}</div>
                    </div>
                </div>
            `;
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Speech synthesis is not supported in this browser.');
            }
        }

        function toggleSave(word) {
            if (savedWords.includes(word)) {
                savedWords = savedWords.filter(w => w !== word);
            } else {
                savedWords.push(word);
            }
            localStorage.setItem('saved_words', JSON.stringify(savedWords));
            if (selectedWord && selectedWord.word === word) {
                selectWord(selectedWord);
            }
        }

        renderWordList();
    </script>
</body>
</html>
